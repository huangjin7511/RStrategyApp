name: Build RStrategyApp

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type: debug or release'
        required: true
        default: 'debug'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle Wrapper (if missing)
        run: |
          if [ ! -f gradlew ]; then
            curl -sL "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -o gradle.zip
            unzip -q gradle.zip
            GRADLE_HOME=$(pwd)/gradle-8.7
            $GRADLE_HOME/bin/gradle wrapper --gradle-version 8.7
            rm -rf gradle-8.7 gradle.zip
          fi
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Lint check
        run: ./gradlew lint

  build-debug:
    needs: lint
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle Wrapper (if missing)
        run: |
          if [ ! -f gradlew ]; then
            curl -sL "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -o gradle.zip
            unzip -q gradle.zip
            GRADLE_HOME=$(pwd)/gradle-8.7
            $GRADLE_HOME/bin/gradle wrapper --gradle-version 8.7
            rm -rf gradle-8.7 gradle.zip
          fi
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: r-strategy-app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  build-release:
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle Wrapper (if missing)
        run: |
          if [ ! -f gradlew ]; then
            curl -sL "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -o gradle.zip
            unzip -q gradle.zip
            GRADLE_HOME=$(pwd)/gradle-8.7
            $GRADLE_HOME/bin/gradle wrapper --gradle-version 8.7
            rm -rf gradle-8.7 gradle.zip
          fi
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
      - name: Build release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Sign APK (if keystore present)
        if: env.KEYSTORE_PATH != ''
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore $KEYSTORE_PATH \
            -storepass $KEYSTORE_PASSWORD \
            -keypass $KEY_PASSWORD \
            app/build/outputs/apk/release/app-release-unsigned.apk $KEY_ALIAS
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/RStrategyApp-signed.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: r-strategy-app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
